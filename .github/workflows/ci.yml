name: ci

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - run: npm ci

            - run: npm run check

            - run: npm run build

            # THE GATE dist/ MUST PASS.
            #
            # stremio-tv-plugin-web-links's GitHub import reads the COMPILED
            # `dist/cinejoy.mjs` straight from this repo's `dist/` folder --
            # there is no build step on the plugin side. That only works if
            # what is committed to `dist/` on `main` is exactly what a fresh
            # build produces.
            - name: Verify dist/ is up to date with a fresh build
              run: |
                  if ! git diff --exit-code -- dist/; then
                    echo "::error::dist/ is out of date -- run 'npm run build' and commit the result before pushing."
                    exit 1
                  fi
